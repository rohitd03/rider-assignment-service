apiVersion: v1
kind: Service
metadata:
  name: {{ include "rider-assignment.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rider-assignment.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "rider-assignment.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
