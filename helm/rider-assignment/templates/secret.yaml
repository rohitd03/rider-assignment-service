apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rider-assignment.name" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rider-assignment.labels" . | nindent 4 }}
  annotations:
    # Prevent Helm from deleting this Secret on uninstall so credentials
    # are not accidentally wiped. Remove this annotation if using ESO.
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Values from values.yaml are plain text; b64enc encodes them here.
  # In production pass credentials via --set or External Secrets Operator
  # rather than storing them in any values file.
  POSTGRES_USER: {{ .Values.secret.postgresUser | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.secret.postgresPassword | b64enc | quote }}
