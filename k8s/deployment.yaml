apiVersion: apps/v1
kind: Deployment
metadata:
  name: rider-assignment
  namespace: rider-assignment
  labels:
    app: rider-assignment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rider-assignment
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: rider-assignment
    spec:
      # 35s = 30s graceful drain + 5s buffer. Matches the shutdown timeout
      # in cmd/server/main.go so the pod is never killed mid-request.
      terminationGracePeriodSeconds: 35
      # Wait for PostgreSQL and Redis to accept connections before starting the
      # main container. Without this the service exits immediately on startup
      # (os.Exit after a failed ping) and the pod enters CrashLoopBackOff.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL at postgres:5432..."
              until nc -z postgres 5432; do
                echo "postgres not ready — retrying in 3s"
                sleep 3
              done
              echo "PostgreSQL ready."
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Redis at redis:6379..."
              until nc -z redis 6379; do
                echo "redis not ready — retrying in 3s"
                sleep 3
              done
              echo "Redis ready."
      containers:
        - name: rider-assignment
          # change to ghcr.io image for production
          image: rider-assignment-service:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Env vars are resolved in declaration order. Variables that use
            # $(VAR) substitution must appear after the vars they reference.
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: rider-assignment-config
                  key: HTTP_PORT
            # --- PostgreSQL pieces (resolved before DATABASE_URL) ---
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: rider-assignment-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: rider-assignment-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: rider-assignment-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: rider-assignment-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rider-assignment-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              # use sslmode=require in production with a managed PostgreSQL service
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=disable"
            # --- Redis pieces (resolved before REDIS_ADDR) ---
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: rider-assignment-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: rider-assignment-config
                  key: REDIS_PORT
            - name: REDIS_ADDR
              value: "$(REDIS_HOST):$(REDIS_PORT)"
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: rider-assignment-config
                  key: KAFKA_BROKERS
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Readiness uses TCP — the pod is marked Ready once postgres + redis
          # init containers complete and the HTTP server is listening on 8080.
          # Use kubectl exec + curl /health for detailed dependency status.
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          # Liveness uses a TCP check — confirms the HTTP server is listening.
          # Using /health here would kill the pod whenever a dependency
          # (e.g. Kafka) is temporarily unreachable, which is too aggressive.
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
