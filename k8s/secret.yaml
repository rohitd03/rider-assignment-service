apiVersion: v1
kind: Secret
metadata:
  name: rider-assignment-secret
  namespace: rider-assignment
  annotations:
    # In production, delete this Secret and replace it with an ExternalSecret
    # resource managed by the External Secrets Operator (external-secrets.io).
    # ESO syncs credentials from AWS Secrets Manager, HashiCorp Vault, or GCP
    # Secret Manager, keeping sensitive values out of version control entirely.
    # Never commit real credentials to this file.
type: Opaque
data:
  # Placeholder values — base64 of "postgres".
  # Generate your own: echo -n "<value>" | base64
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: cG9zdGdyZXM=
