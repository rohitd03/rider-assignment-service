# Local-only PostgreSQL for minikube development.
# Replace with a managed service (AWS RDS, Cloud SQL, etc.) in production.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: rider-assignment
data:
  init.sql: |
    -- riders must be created before orders because orders.rider_id references it.

    CREATE TABLE IF NOT EXISTS riders (
        id               UUID             PRIMARY KEY DEFAULT gen_random_uuid(),
        name             VARCHAR(255)     NOT NULL,
        is_available     BOOLEAN          NOT NULL DEFAULT TRUE,
        lat              DOUBLE PRECISION NOT NULL DEFAULT 0,
        lng              DOUBLE PRECISION NOT NULL DEFAULT 0,
        last_assigned_at TIMESTAMPTZ
    );

    CREATE INDEX IF NOT EXISTS idx_riders_available ON riders(is_available);

    CREATE TABLE IF NOT EXISTS orders (
        id         UUID             PRIMARY KEY DEFAULT gen_random_uuid(),
        rider_id   UUID             REFERENCES riders(id),
        status     VARCHAR(20)      NOT NULL DEFAULT 'CREATED',
        pickup_lat DOUBLE PRECISION NOT NULL,
        pickup_lng DOUBLE PRECISION NOT NULL,
        created_at TIMESTAMPTZ      NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_orders_status ON orders(status);
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: rider-assignment
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: rider-assignment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: rider_assignment
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init-sql
